name: Trigger Playwright_RUNNER on Jenkins

on:
  workflow_dispatch:
    inputs:
      qa_environment:
        description: QA environment name
        required: true
        default: snb_perf93
        type: string
      testing_snb_branch:
        description: Branch in the testing repo
        required: true
        default: snb_apps_93
        type: choice
        options:
          - snb_apps_93
          - RL_snb_apps_93
          - MS2_snb_apps_93
          - yaro_snb_apps_93
      testing_tag_name:
        description: Tag to execute
        required: true
        default: '@SSSMP1VUIO-NewToReject_PERF'
        type: choice
        options:
          - '@SSSMP1VUIO-NewToReject_PERF'
          - '@SSSMP1VUIO-NewToRelease_PERF'
      shards:
        description: Number of Playwright shards
        required: true
        default: '6'
        type: string
      baseline_user:
        description: Baseline login for the screen-timing run
        required: true
        default: aml_investigator
        type: string
      perf_users:
        description: Comma-separated usernames for concurrent load
        required: true
        default: export_lc_investigator,outgoing_coll_supervisor,outgoing_coll_investigator,legal_supervisor,legal_investigator,ssu_record_manager,snb_it_admin,non_ssu_admin,non_ssu_record_manager,ssu_admin,query_user,compliance_supervisor,ssu_supervisor,compliance_investigator,payment_ops_supervisor,payment_ops_investigator,aml_supervisor,aml_investigator,ssu_investigator,inward_lg_investigator,outward_lg_investigator,import_lc_investigator,incoming_coll_supervisor,outward_lg_supervisor,incoming_coll_investigator,inward_lg_supervisor,import_lc_supervisor
        type: string

jobs:
  trigger-jenkins:
    name: Trigger Playwright_RUNNER
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JENKINS_URL: ${{ secrets.JENKINS_URL }}
      JENKINS_USER: ${{ secrets.JENKINS_USER }}
      JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

    steps:
      - name: Validate Jenkins secrets
        shell: bash
        run: |
          test -n "$JENKINS_URL" || { echo "Missing JENKINS_URL secret"; exit 1; }
          test -n "$JENKINS_USER" || { echo "Missing JENKINS_USER secret"; exit 1; }
          test -n "$JENKINS_API_TOKEN" || { echo "Missing JENKINS_API_TOKEN secret"; exit 1; }

      - name: Trigger Jenkins job
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -u "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
            --data-urlencode "json={
              \"parameter\":[
                {\"name\":\"QA_ENVIRONMENT\",\"value\":\"${{ github.event.inputs.qa_environment }}\"},
                {\"name\":\"TESTING_SNB_BRANCH\",\"value\":\"${{ github.event.inputs.testing_snb_branch }}\"},
                {\"name\":\"TESTING_TAG_NAME\",\"value\":\"${{ github.event.inputs.testing_tag_name }}\"},
                {\"name\":\"SHARDS\",\"value\":\"${{ github.event.inputs.shards }}\"},
                {\"name\":\"BASELINE_USER\",\"value\":\"${{ github.event.inputs.baseline_user }}\"},
                {\"name\":\"PERF_USERS\",\"value\":\"${{ github.event.inputs.perf_users }}\"}
              ]
            }" \
            "${JENKINS_URL}/job/Playwright_RUNNER/buildWithParameters"

      - name: Poll Jenkins result
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 120); do
            JSON=$(curl --fail --silent --show-error \
              -u "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
              "${JENKINS_URL}/job/Playwright_RUNNER/lastBuild/api/json?tree=number,result,url") || exit 1

            RESULT=$(printf '%s' "$JSON" | python -c 'import json,sys; data=json.load(sys.stdin); print(data.get("result") or "")')
            NUMBER=$(printf '%s' "$JSON" | python -c 'import json,sys; data=json.load(sys.stdin); print(data.get("number") or "")')

            if [ -n "$RESULT" ]; then
              echo "Jenkins build #${NUMBER} finished with result: ${RESULT}"
              if [ "$RESULT" != "SUCCESS" ]; then
                exit 1
              fi
              exit 0
            fi

            echo "Build #${NUMBER:-unknown} still running... waiting 10s"
            sleep 10
          done

          echo "Timed out waiting for Jenkins build to finish"
          exit 1
