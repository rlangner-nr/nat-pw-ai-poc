name: CI

on:
  push:
    branches: ['project/**']
  pull_request:
    branches: ['project/**']
  workflow_dispatch:

jobs:
  core:
    name: Lint + Playwright list
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # Catches broken YAML structure and shell syntax in workflow `run:` steps
      # (e.g. a step pasted into another step's script) before they reach the runner.
      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck= .github/workflows/perf-run.yml .github/workflows/perf-remote.yml

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: List Playwright tests
        run: npx playwright test --list

      # Live UI/SSH against customer environments requires secrets.
      # Add a separate job later for explicit env-backed runs such as:
      # npm run test:smoke
