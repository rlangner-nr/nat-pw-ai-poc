# Example project overlay for a NetReveal deployment (no secrets).
# Usage:
#   cp config/projects/example.properties config/local.properties
#   cp .env.example .env
# Edit local.properties / .env — both are gitignored.
#
# Customer projects (e.g. UNIQA): keep overlays on a project branch or private
# fork — do not merge real URLs/passwords into core main.

ProjectName=ACME
dns.domain=acme.example.local
application.environment=qa1
application.port=24200

# Fully resolved URL also works (skips template host pattern):
# ui.baseUrl=https://ui-lb.qa1.acme.example.local:24200/netreveal/login.do

# For non-admin perf runs, set a default password and choose real role logins:
# userDataAdminUsername=admin
# userDataAdminPassword=${USER_DATA_ADMIN_PASSWORD}
# userDataDefaultPassword=${USER_DATA_DEFAULT_PASSWORD}
# perf.baselineUser=aml_investigator
# perf.users=aml_investigator,aml_supervisor,compliance_investigator,compliance_supervisor

userDataAdminUsername=admin
# Prefer ENV / .env: USER_DATA_ADMIN_PASSWORD / USER_DATA_DEFAULT_PASSWORD

ssh.host=batch.qa1.acme.example.local
ssh.user=ec2-user
# Prefer ENV: SSH_KEYFILE=/absolute/path/to/key.ppk

# Plain Search only in All Alerts: no explicit WLM criteria to keep the screen focused.
# perf.allAlerts.criteria=
